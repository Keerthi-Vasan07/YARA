[pytest]
# =============================================================================
# Pytest Configuration for ECV Viewer
# =============================================================================
# Configured for ECMWF ITT requirements (Requirement 3: Pytest preferred)

testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests requiring external services
    e2e: marks end-to-end tests
    azurite: marks tests requiring Azurite Azure Storage emulator

# Default options
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

# Async mode for FastAPI tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Suppress noisy warnings from test data
filterwarnings =
    ignore:Mean of empty slice:RuntimeWarning
    ignore:All-NaN slice encountered:RuntimeWarning
    ignore:Degrees of freedom <= 0:RuntimeWarning

# Coverage configuration
[coverage:run]
source = server
omit = 
    server/pipeline/downloaders/*
    tests/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if TYPE_CHECKING:
